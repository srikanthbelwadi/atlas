# Firebase App Hosting build/runtime config for the Next.js frontend.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# All values below are plain `value:` entries, not App Hosting secrets —
# every NEXT_PUBLIC_* variable is baked into the client bundle and shipped
# to the browser regardless, and Firebase's own web config (apiKey, appId,
# etc.) is designed to be public: it identifies the project, it doesn't
# authorize anything by itself. Real access control is server-side, in
# Firestore security rules and the orchestrator's own approved-user check.
#
# NEXT_PUBLIC_ATLAS_API_BASE_URL is the orchestrator's real Cloud Run URL,
# confirmed live (its /healthz and unmatched-route paths both respond
# correctly) after the first `gcloud run deploy` from infra/README.md.

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_ATLAS_API_BASE_URL
    value: https://atlas-orchestrator-653988957394.us-central1.run.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCiJgfB21AncLVOzA2tAAiz5m8hRjiwG3I
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: atlas-ard-okf.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: atlas-ard-okf
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:653988957394:web:1125356d711364ef84310b"
    availability:
      - BUILD
      - RUNTIME
  # Finance section (atlasdata.world/finance). "true" since 2026-09-03, after
  # the finance-enabled orchestrator revision passed the golden sets
  # (tests/golden/: public 10/10, finance_a 6/6, finance_b 6/6). Set back to
  # "false" to hide the section again (the /finance routes 404 and the
  # header link disappears) without touching the backend.
  - variable: NEXT_PUBLIC_ATLAS_FINANCE_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Places section (atlasdata.world/places) — Google Data Commons behind the
  # `places` pack. "true" since 2026-09-06, after the places-enabled
  # orchestrator revision (ATLAS_PACKS_ENABLED=public,finance,places,
  # DC_API_KEY from Secret Manager) passed tests/golden/places_a.yaml 9/9
  # and public_regression 10/10. Set back to "false" to hide the section
  # (the /places routes 404 and the header link disappears).
  - variable: NEXT_PUBLIC_ATLAS_PLACES_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  # Shown as a mailto link wherever a user needs a person: the "awaiting
  # approval" state on /finance and the "you can't access this private data"
  # refusal card. Matches the backend's default ATLAS_ADMIN_EMAILS. Leave
  # empty to show "your Atlas administrator" with no link.
  - variable: NEXT_PUBLIC_ATLAS_ADMIN_CONTACT
    value: srikanthbelwadi@gmail.com
    availability:
      - BUILD
      - RUNTIME
