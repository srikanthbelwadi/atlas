# Firebase App Hosting build/runtime config for the Next.js frontend.
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# All values below are plain `value:` entries, not App Hosting secrets —
# every NEXT_PUBLIC_* variable is baked into the client bundle and shipped
# to the browser regardless, and Firebase's own web config (apiKey, appId,
# etc.) is designed to be public: it identifies the project, it doesn't
# authorize anything by itself. Real access control is server-side, in
# Firestore security rules and the orchestrator's own approved-user check.
#
# NEXT_PUBLIC_ATLAS_API_BASE_URL is the orchestrator's real Cloud Run URL,
# confirmed live (its /healthz and unmatched-route paths both respond
# correctly) after the first `gcloud run deploy` from infra/README.md.

runConfig:
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_ATLAS_API_BASE_URL
    value: https://atlas-orchestrator-653988957394.us-central1.run.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCiJgfB21AncLVOzA2tAAiz5m8hRjiwG3I
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: atlas-ard-okf.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: atlas-ard-okf
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:653988957394:web:1125356d711364ef84310b"
    availability:
      - BUILD
      - RUNTIME
  # Finance section (atlasdata.world/finance). Off by default: with it unset
  # or "false" the /finance routes 404 and the header shows no link, so the
  # public demo is unchanged. Flip to "true" only after the orchestrator is
  # serving ATLAS_PACKS_ENABLED=public,finance and the finance crawl has run
  # (scripts/finance_phase0.sh), then redeploy.
  - variable: NEXT_PUBLIC_ATLAS_FINANCE_ENABLED
    value: "false"
    availability:
      - BUILD
      - RUNTIME
