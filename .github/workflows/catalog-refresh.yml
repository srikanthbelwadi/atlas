# Rebuilds and redeploys the crawler's Cloud Run Job whenever its code
# changes. This workflow does NOT run the crawl itself — a Cloud Scheduler
# job (infra/README.md, "still to design/build") invokes
# `gcloud run jobs execute atlas-crawler` weekly. This just keeps the job
# definition itself current.
#
# Same WIF prerequisite as deploy-backend.yml — not live until
# GCP_WORKLOAD_IDENTITY_PROVIDER / GCP_SERVICE_ACCOUNT secrets exist.

name: Refresh catalog crawler

on:
  push:
    branches: [main]
    paths:
      - "backend/crawler/**"
      - "backend/orchestrator/llm.py"
      - ".github/workflows/catalog-refresh.yml"
  workflow_dispatch: {}

env:
  PROJECT_ID: atlas-ard-okf
  REGION: us-central1
  JOB_NAME: atlas-crawler
  IMAGE: us-central1-docker.pkg.dev/atlas-ard-okf/atlas-images/atlas-crawler

jobs:
  build-and-deploy-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build
        run: docker build -f backend/crawler/Dockerfile -t ${{ env.IMAGE }}:${{ github.sha }} .

      - name: Push
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Create or update the Cloud Run Job
        run: |
          gcloud run jobs deploy ${{ env.JOB_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }} \
            --max-retries=1 \
            --task-timeout=15m
