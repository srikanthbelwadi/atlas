# CI for the frontend. Firebase App Hosting deploys itself: once
# `firebase apphosting:backends:create` connects this repo (one-time,
# console or CLI step — not yet done, see infra/README.md), App Hosting
# watches `main` directly via its own Cloud Build trigger and rolls out on
# every push to frontend/** — no GitHub Actions step actually ships the
# frontend. What this workflow does is the thing App Hosting's own trigger
# doesn't: fail a pull request loudly if the app doesn't type-check or build,
# before it ever reaches main.

name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm install

      - run: npx tsc --noEmit

      # Placeholder values — this only checks that the build itself succeeds,
      # not that it's wired to the real backend/Firebase project.
      - name: Build
        run: npx next build
        env:
          NEXT_PUBLIC_ATLAS_API_BASE_URL: https://example.run.app
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: placeholder.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder
